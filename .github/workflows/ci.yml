name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: offline test suite (sh is dash here)
        run: make test
      - name: same suite under busybox sh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq busybox
          mkdir -p /tmp/bb && ln -sf "$(command -v busybox)" /tmp/bb/sh
          PATH=/tmp/bb:$PATH sh tests/run.sh

  demo:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: compose demo (green, then drift)
        run: make demo
      - name: nothing left behind
        run: |
          left=$(docker ps -a --filter "name=configcheck-demo" -q)
          [ -z "$left" ] || { docker ps -a; exit 1; }
