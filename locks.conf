# Closed list of lock names for bin/drift-lock. One name per line.
# A name that is not here is refused, so a typo can never create a new,
# unshared lock that silently excludes nobody.

queue     short: allocating a ticket number in the merge queue
merge     long: merging queued changes and running the gate
verify    one verifier run at a time against the same hosts
demo      the compose demo (one stack per checkout)
